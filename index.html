<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RENNI Gastos</title>
<meta name="theme-color" content="#7E1862">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RENNI Gastos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#7E1862; --brand-2:#9a2a7a; --orange:#E9803A; --orange-soft:#fdf1e8;
  --bg:#f6f5f7; --surface:#fff; --surface-2:#faf9fb; --text:#1d1a20; --muted:#6c6672; --faint:#9a94a0;
  --border:#e8e4ec; --border-2:#d9d3df;
  --red:#d14343; --red-soft:#fdeeee; --amber:#c47d0e; --amber-soft:#fdf5e6; --green:#2c9466; --green-soft:#e9f6ef; --blue:#3a6fd8; --blue-soft:#ecf2fd;
  --radius:12px; --shadow:0 1px 2px rgba(30,20,40,.05),0 4px 16px rgba(30,20,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#7E1862 0%,#5c1048 100%)}
.login-card{background:var(--surface);border-radius:20px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
.login-card img{width:96px;height:96px;margin-bottom:10px}
.login-card h1{font-size:20px;margin:4px 0 2px}
.login-card p{color:var(--muted);margin:0 0 22px;font-size:14px}
.login-card form{text-align:left;display:grid;gap:12px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand img{width:40px;height:40px}
.brand b{display:block;font-size:15px}
.brand span{font-size:12px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;text-align:left;color:var(--muted);font-weight:500;width:100%}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:#f5ecf2;color:var(--brand)}
.nav-item svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:1px 7px;min-width:20px;text-align:center}
.badge.amber{background:var(--amber)}
.side .btn-primary{margin:10px 0 14px}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px;font-size:13px;color:var(--muted)}
.side-foot .who{padding:0 10px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{padding:26px 32px 48px;width:100%;max-width:1240px}
.topbar{display:none}
.bottomnav{display:none}
.demo-bar{background:var(--orange-soft);color:#8a4511;border:1px solid #f5d3b8;padding:8px 12px;border-radius:10px;font-size:13px;margin-bottom:16px}

/* ---------- Common ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:22px;margin:0;letter-spacing:-.01em}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;gap:8px}
.card-h h3{font-size:14px;margin:0;font-weight:600}
.card-h .link{font-size:13px;color:var(--brand);background:none;border:0;font-weight:500;padding:0}
.card-b{padding:8px 16px 16px}
.btn{border:1px solid var(--border-2);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;justify-content:center}
.btn-primary:hover{background:var(--brand-2)}
.btn-orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-orange:hover{background:#d8702b}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn-danger{color:var(--red);border-color:#f0caca}
.btn-ghost{border-color:transparent;background:none}
.empty{padding:28px 12px;text-align:center;color:var(--faint);font-size:14px}

.field{display:grid;gap:5px}
.field>span{font-size:12.5px;font-weight:500;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--border-2);background:var(--surface);border-radius:9px;padding:9px 11px;outline:none;min-height:40px}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(126,24,98,.12)}
textarea.input{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg label{flex:1;min-width:max-content}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:7px 10px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer}
.seg input:checked+span{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border-2);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.note{font-size:12.5px;color:var(--muted)}
.box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.gray{background:#f0eef2;color:var(--muted)}
.pill.purple{background:#f5ecf2;color:var(--brand)}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.kpi .d{font-size:12.5px;margin-top:4px;color:var(--muted)}
.kpi .d .up{color:var(--red)} .kpi .d .down{color:var(--green)}
.kpi.kpi-red .v{color:var(--red)}
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.dash-grid .full{grid-column:1/-1}
.alerts{display:grid;gap:8px;margin-bottom:14px}
.alert{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;border:1px solid}
.alert.red{background:var(--red-soft);border-color:#f3cccc}
.alert.amber{background:var(--amber-soft);border-color:#f2deb5}
.alert .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.alert.red .ico{background:var(--red)} .alert.amber .ico{background:var(--amber)}
.alert .ico svg{width:16px;height:16px}
.alert .t{flex:1;min-width:0}
.alert .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert .t small{font-size:12.5px;color:var(--muted)}
.alert .amt{font-weight:600;white-space:nowrap}

.bars{display:flex;align-items:flex-end;gap:10px;height:190px;padding:18px 4px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:pointer;border:0;background:none;padding:0}
.bar .col{width:100%;max-width:54px;border-radius:7px 7px 3px 3px;background:#e9dbe5;transition:background .15s;min-height:3px}
.bar:hover .col{background:#d8bccf}
.bar.sel .col{background:var(--brand)}
.bar .val{font-size:11.5px;color:var(--muted);font-weight:500}
.bar .lab{font-size:12px;color:var(--muted);text-transform:capitalize}
.bar.sel .lab{color:var(--text);font-weight:600}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0}
.hbar .n{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .a{font-size:13.5px;font-weight:600;text-align:right}
.hbar .track{grid-column:1/-1;height:7px;background:#f0edf2;border-radius:99px;overflow:hidden}
.hbar .fill{height:100%;border-radius:99px;background:var(--brand)}
.hbar .p{font-weight:400;color:var(--faint);font-size:12px;margin-left:6px}
.pays{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pay{border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.pay .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pay .l i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pay .v{font-weight:600;margin-top:4px}

/* ---------- Lists ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .input{width:auto;min-width:140px;min-height:36px;padding:6px 10px;font-size:14px}
.filters .search{flex:1;min-width:180px}
.list-sum{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--muted);gap:10px;flex-wrap:wrap}
.list-sum b{color:var(--text);font-size:16px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 84px 150px 120px;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.r-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.r-title svg{width:14px;height:14px;color:var(--faint);flex:none}
.r-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.r-date{font-size:13px;color:var(--muted)}
.r-amt{text-align:right;font-weight:600}
.row-pp{grid-template-columns:minmax(0,1fr) 150px 120px 120px}
.group-h{padding:12px 16px 8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:flex;justify-content:space-between;background:var(--surface-2);border-bottom:1px solid var(--border)}
.group-h.red{color:var(--red)} .group-h.amber{color:var(--amber)}
.pp-grid{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
.fijo{display:grid;grid-template-columns:minmax(0,1fr) 120px 160px auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.fijo:last-child{border-bottom:0}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(25,15,30,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .18s}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:17px}
.modal-b{padding:16px 20px;overflow-y:auto;display:grid;gap:14px}
.modal-f{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.modal-f .spacer{flex:1}
.x{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.item-row{display:grid;grid-template-columns:minmax(0,2fr) 70px 92px minmax(0,1.2fr) 32px;gap:6px;align-items:center}
@media (max-width:600px){.item-row{grid-template-columns:72px minmax(0,1fr) minmax(0,1.3fr) 32px;padding-bottom:8px;border-bottom:1px dashed var(--border-2)}.item-row [data-k=producto]{grid-column:1/-1}}
.photo-prev{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--border);display:block}
@keyframes fade{from{opacity:0}} @keyframes pop{from{transform:translateY(12px);opacity:0}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#231b28;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.dash-grid,.pp-grid{grid-template-columns:1fr}}
@media (max-width:899px){
  .input,select.input,textarea.input,.filters .input{font-size:16px}
  input[type=date].input,input[type=month].input{-webkit-appearance:none;appearance:none;display:block;text-align:left;line-height:22px}
  input[type=date]::-webkit-date-and-time-value{text-align:left}
  .seg span{padding:8px 6px;font-size:13px}
  .page-head select.input{width:100%!important}
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
  .topbar img{width:34px;height:34px}
  .topbar b{font-size:16px;flex:1}
  .main{padding:16px 16px 110px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px max(6px,env(safe-area-inset-bottom))}
  .bn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);font-weight:500;position:relative;padding:4px 0}
  .bn svg{width:22px;height:22px}
  .bn.active{color:var(--brand)}
  .bn .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0;font-size:10px;padding:0 5px;min-width:16px}
  .bn-add{display:grid;place-items:center}
  .bn-add span{width:50px;height:50px;border-radius:16px;background:var(--orange);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(233,128,58,.45);margin-top:-18px}
  .bn-add svg{width:26px;height:26px}
  .page-head h2{font-size:20px}
  .page-head .btn-desk{display:none}
  .kpi .v{font-size:20px}
  .pays{grid-template-columns:repeat(2,1fr)}
  .row,.row-pp{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px}
  .row .r-date{display:none}
  .row .r-state{grid-column:1;grid-row:2}
  .row .r-amt{grid-column:2;grid-row:1}
  .row-pp .r-act{grid-column:2;grid-row:2;justify-self:end}
  .fijo{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .fijo .f-amt{text-align:right}
  .fijo .r-title{white-space:normal}
  .fijo .r-sub{white-space:normal}
  .fijo .f-state{grid-column:1}
  .fijo .f-act{justify-self:end}
  .filters .input{flex:1 1 45%;min-width:0}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{max-width:none;border-radius:18px 18px 0 0;max-height:94vh}
  .alert{flex-wrap:wrap}
  .alert .t{flex:1 1 calc(100% - 42px)}
  .alert .amt{margin-left:42px}
  .alert .btn{margin-left:auto}
  .toast{bottom:96px}
}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.kpis{gap:10px}.kpi{padding:12px}}
</style>
</head>

<script type="module">
/* ================================================================
   1) CONFIGURACIÓN — pega aquí la configuración de tu proyecto Firebase
      (Consola Firebase → Configuración del proyecto → Tus apps → SDK).

const firebaseConfig = {

  authDomain: "renni-gastos-48711.firebaseapp.com",
  projectId: "renni-gastos-48711",
  storageBucket: "renni-gastos-48711.firebasestorage.app",
  messagingSenderId: "265069610837",
  appId: "1:265069610837:web:cf655b47f6271b3efa51dc"
};

/* Listas editables */
const CENTROS = ['Fábrica Helados','Fábrica Pasteles','Local Antonio Varas','Local La Compañía','Oficina'];
const CATEGORIAS = ['Materia prima','Insumos y envases','Arriendo','Luz','Agua','Gas','Internet y telefonía','Mantención y reparaciones','Transporte y combustible','Limpieza y aseo','Marketing','Servicios profesionales','Impuestos y patentes','Sueldos y remuneraciones','Otros'];
const CENTS = () => state.listas?.centros?.length ? state.listas.centros : CENTROS;
const CATS = () => state.listas?.categorias?.length ? state.listas.categorias : CATEGORIAS;
const TIPOS = {factura:'Factura', boleta:'Boleta', sindoc:'Sin boleta', sueldo:'Sueldo', otro:'Otro'};
const TIPO_SUELDO = {anticipo:'Anticipo', remuneracion:'Remuneración', bono:'Bono', finiquito:'Finiquito', otro:'Otro'};
const JORNADAS = {full:'Full time', part:'Part time'};
const UNIDADES = ['un','kg','g','lt','caja','bolsa','bandeja','paquete','saco'];
const CAT_SUELDOS = 'Sueldos y remuneraciones';
const TRABS = () => state.listas?.trabajadores || [];
const PAGOS = {transferencia:'Transferencia', efectivo:'Efectivo', tarjeta:'Tarjeta', credito:'Crédito'};
const MEDIOS_PAGO_CREDITO = {transferencia:'Transferencia', efectivo:'Efectivo', cheque:'Cheque', tarjeta:'Tarjeta'};
const PAGO_COLOR = {transferencia:'#3a6fd8', efectivo:'#2c9466', tarjeta:'#9a94a0', credito:'#E9803A'};
const AVISO_FACTURAS_DIAS = 7;   // avisar facturas a crédito que vencen en ≤ N días

const DEMO = firebaseConfig.apiKey.startsWith('TU_');

/* ================================================================
   2) UTILIDADES
   ================================================================ */
const $ = (s, el=document) => el.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const diffDays = (a,b) => Math.round((parseD(a) - parseD(b)) / 864e5);
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const curYM = () => today().slice(0,7);
const shiftYM = (ym,n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ymLabel = ym => { const [y,m] = ym.split('-').map(Number); return `${MESES[m-1]} ${y}`; };
const fdate = s => { if(!s) return '—'; const [y,m,d] = s.split('-').map(Number); return `${pad(d)} ${MES3[m-1]}${y!==new Date().getFullYear()?' '+y:''}`; };
const clp = n => '$' + Math.round(n||0).toLocaleString('es-CL');

async function firebaseStore(){
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{initializeApp}, A, F] = await Promise.all([
    import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch { db = F.getFirestore(app); }
  const unsubs = [];
  return {
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(u ? { email:u.email } : null)),
    login: (e,p) => A.signInWithEmailAndPassword(auth, e, p),
    logout: () => { unsubs.splice(0).forEach(u => u()); return A.signOut(auth); },
    reset: e => A.sendPasswordResetEmail(auth, e),
    watch(col, cb, onErr){ unsubs.push(F.onSnapshot(F.collection(db, col), s => cb(s.docs.map(d => ({ id:d.id, ...d.data() }))), onErr)); },
    add: async (col, data) => (await F.addDoc(F.collection(db, col), data)).id,
    set: (col, id, data) => F.setDoc(F.doc(db, col, id), data),
    update: (col, id, data) => F.updateDoc(F.doc(db, col, id), data),
    remove: (col, id) => F.deleteDoc(F.doc(db, col, id)),
    get: async (col, id) => { const s = await F.getDoc(F.doc(db, col, id)); return s.exists() ? s.data() : null; },
  };
}

    watch(col, cb){ (watchers[col] ||= []).push(cb); setTimeout(() => emit(col)); },
    async add(col, data){ const id = uid(); (db[col] ||= {})[id] = data; save(); emit(col); return id; },

/* Períodos: 'YYYY-MM' (mes) o 'w:YYYY-MM-DD' (semana que parte el lunes) */
const weekStart = d => { const x = parseD(d); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return ymd(x); };
const isWeek = p => String(p).startsWith('w:');
const inPeriod = (fecha, p) => { if (!p || p === 'todos') return true; fecha = fecha || '';
  if (isWeek(p)) { const ws = p.slice(2); return fecha >= ws && fecha <= addDays(ws, 6); } return fecha.startsWith(p); };
const prevPeriod = (p, n = -1) => isWeek(p) ? 'w:' + addDays(p.slice(2), 7*n) : shiftYM(p, n);
const weekLabel = ws => { const we = addDays(ws, 6), [, m1, d1] = ws.split('-').map(Number), [, m2, d2] = we.split('-').map(Number);
  return m1 === m2 ? `${pad(d1)}–${pad(d2)} ${MES3[m2-1]}` : `${pad(d1)} ${MES3[m1-1]}–${pad(d2)} ${MES3[m2-1]}`; };
const periodLabel = p => p === 'todos' ? 'todos los meses' : isWeek(p) ? 'semana ' + weekLabel(p.slice(2)) : ymLabel(p);
const periodShort = p => isWeek(p) ? pad(Number(p.slice(10))) + ' ' + MES3[Number(p.slice(7,9))-1] : MES3[Number(p.slice(5))-1];
const gastosPeriodo = (p, centro) => state.gastos.filter(g => inPeriod(g.fecha, p) && (!centro || g.centro === centro));
/* Abonos a facturas a crédito */
const abonado = g => (g.abonos||[]).reduce((a,x) => a + (Number(x.monto)||0), 0);
const saldo = g => g.formaPago === 'credito' && g.estado !== 'pagado' ? Math.max(0, (Number(g.total)||0) - abonado(g)) : 0;
const sumSaldo = arr => arr.reduce((a,g) => a + saldo(g), 0);
const gastosMes = ym => state.gastos.filter(g => (g.fecha||'').startsWith(ym));
const pendientes = () => state.gastos.filter(g => g.formaPago === 'credito' && g.estado !== 'pagado')
  .sort((a,b) => (a.vencimiento||'9').localeCompare(b.vencimiento||'9'));
const fijoPagado = (f, ym) => state.gastos.find(g => g.fijoId === f.id && g.periodo === ym);
const fijoDue = (f, ym) => { const [y,m] = ym.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return `${ym}-${pad(Math.min(Number(f.dia)||1, last))}`; };

/* Estado de cada gasto fijo para los meses relevantes (mes anterior impago, mes actual, próximo si está dentro del aviso) */
function fijosPendientes(){
  const t = today(), ym = curYM(), out = [];
  state.fijos.filter(f => f.activo !== false).forEach(f => {
    [shiftYM(ym,-1), ym, shiftYM(ym,1)].forEach(m => {
      if (f.desde && m < f.desde) return;
      if (fijoPagado(f, m)) return;
      const due = fijoDue(f, m), d = diffDays(due, t), aviso = Number(f.avisarDias ?? 5);
      if (m !== ym && d > aviso) return;
      if (m < ym && d >= 0) return;
      out.push({ f, ym:m, due, d, nivel: d < 0 ? 'red' : d <= aviso ? 'amber' : 'ok' });
    });
  });
  return out.sort((a,b) => a.due.localeCompare(b.due));
}

function alertas(){
  const t = today();
  const fac = pendientes().filter(g => g.vencimiento && diffDays(g.vencimiento, t) <= AVISO_FACTURAS_DIAS)
    .map(g => ({ tipo:'factura', g, d:diffDays(g.vencimiento, t), due:g.vencimiento }));
  const fij = fijosPendientes().filter(x => x.nivel !== 'ok').map(x => ({ tipo:'fijo', ...x }));
  return [...fij, ...fac].map(a => ({ ...a, nivel: a.d < 0 ? 'red' : 'amber' })).sort((a,b) => a.due.localeCompare(b.due));
}

function viewDashboard(v){
  const P = state.dashMes, C = state.dashCentro, wk = isWeek(P);
  const ym = wk ? P.slice(2,9) : P;
  const g = gastosPeriodo(P, C), total = sum(g), prev = sum(gastosPeriodo(prevPeriod(P), C));
  const t = today(), pend = pendientes().filter(x => !C || x.centro === C), venc = pend.filter(x => x.vencimiento && x.vencimiento < t);
  const al = alertas().filter(a => !C || (a.tipo === 'fijo' ? a.f.centro : a.g.centro) === C);
  const fijosAct = state.fijos.filter(f => f.activo !== false && (!f.desde || f.desde <= ym) && (!C || f.centro === C));
  const fijosPag = fijosAct.filter(f => fijoPagado(f, ym));
  const delta = prev ? Math.round((total - prev) / prev * 100) : null;
  const periods = Array.from({length: wk ? 8 : 6}, (_,i) => prevPeriod(P, i - (wk ? 7 : 5)));
  const mt = periods.map(p => sum(gastosPeriodo(p, C))), max = Math.max(...mt, 1);
  const byKey = (k, list) => { const o = {}; g.forEach(x => { const key = x[k] || 'Sin asignar'; o[key] = (o[key]||0) + (Number(x.total)||0); });
    let e = Object.entries(o).sort((a,b) => b[1]-a[1]); if (list) { const rest = e.slice(list); e = e.slice(0,list); if (rest.length) e.push(['Otras', rest.reduce((a,x)=>a+x[1],0)]); } return e; };
  const hbars = (entries, color) => entries.length ? entries.map(([n,a]) => `
    <div class="hbar"><div class="n">${esc(n)}</div><div class="a num">${clp(a)}<span class="p">${total?Math.round(a/total*100):0}%</span></div>
    <div class="track"><div class="fill" style="width:${total?a/entries[0][1]*100:0}%;background:${color}"></div></div></div>`).join('') : '<div class="empty">Sin gastos en este período</div>';
  const pagos = Object.keys(PAGOS).map(k => [k, sum(g.filter(x => x.formaPago === k))]);
  // por semana dentro del mes (solo vista mensual)
  let semanas = '';
  if (!wk) { const ws0 = weekStart(P + '-01'), lastDay = addDays(shiftYM(P,1) + '-01', -1), rows = [];
    for (let w = ws0; w <= lastDay; w = addDays(w, 7)) { const list = g.filter(x => x.fecha >= w && x.fecha <= addDays(w,6)); rows.push([w, sum(list), list.length]); }
    const mx = Math.max(...rows.map(r => r[1]), 1);
    semanas = `<div class="card"><div class="card-h"><h3>Por semana · ${ymLabel(P)}</h3></div><div class="card-b">${rows.map(([w,a,n]) => `
      <div class="hbar" style="cursor:pointer" data-mes="w:${w}"><div class="n">${weekLabel(w)} <span class="note">· ${n} doc.</span></div><div class="a num">${clp(a)}</div>
      <div class="track"><div class="fill" style="width:${a/mx*100}%;background:var(--brand-2)"></div></div></div>`).join('')}</div></div>`; }

  v.innerHTML = `
  <div class="page-head">
    <div><h2>Resumen de gastos</h2><div class="sub">${C ? esc(C) + ' · ' : ''}Gastos por fecha de documento</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><select class="input" id="dashMes" style="width:auto">${periodOptions(P)}</select>${centroSelect('dashCentro', C)}</div>
  </div>
  ${al.length ? `<div class="alerts">${al.slice(0,4).map(alertHTML).join('')}${al.length>4?`<button class="btn btn-sm" style="justify-self:start" data-nav="porpagar">Ver ${al.length-4} alerta${al.length-4===1?'':'s'} más</button>`:''}</div>` : ''}
  <div class="kpis">
    <div class="card kpi"><div class="l">Gasto ${wk ? 'semana ' + weekLabel(P.slice(2)) : 'de ' + MESES[Number(P.slice(5))-1]}</div><div class="v num">${clp(total)}</div>
      <div class="d">${delta === null ? `${g.length} documentos` : `<span class="${delta>0?'up':'down'}">${delta>0?'▲':'▼'} ${Math.abs(delta)}%</span> vs ${wk?'semana':'mes'} anterior`}</div></div>
    <div class="card kpi"><div class="l">Facturas por pagar</div><div class="v num">${clp(sumSaldo(pend))}</div><div class="d">${pend.length} factura${pend.length===1?'':'s'} a crédito</div></div>
    <div class="card kpi ${venc.length?'kpi-red':''}"><div class="l">Vencido</div><div class="v num">${clp(sumSaldo(venc))}</div><div class="d">${venc.length ? `${venc.length} factura${venc.length===1?'':'s'} vencida${venc.length===1?'':'s'}` : 'Nada vencido 👍'}</div></div>
    <div class="card kpi"><div class="l">Gastos fijos de ${MESES[Number(ym.slice(5))-1]}</div><div class="v num">${fijosPag.length} / ${fijosAct.length}</div><div class="d">pagados · ${clp(fijosAct.filter(f=>!fijoPagado(f,ym)).reduce((a,f)=>a+Number(f.monto||0),0))} por pagar</div></div>
  </div>
  <div class="dash-grid">
    <div class="card"><div class="card-h"><h3>${wk ? 'Últimas 8 semanas' : 'Últimos 6 meses'}</h3></div>
      <div class="card-b"><div class="bars">${periods.map((p,i) => `
        <button class="bar ${p===P?'sel':''}" data-mes="${p}"><span class="val num">${mt[i]?short(mt[i]):''}</span>
        <div class="col" style="height:${mt[i]/max*130}px"></div><span class="lab">${periodShort(p)}</span></button>`).join('')}</div></div></div>
    ${C ? semanas || `<div class="card"><div class="card-h"><h3>Por centro de costo</h3></div><div class="card-b">${hbars(byKey('centro'), 'var(--brand)')}</div></div>`
        : `<div class="card"><div class="card-h"><h3>Por local / centro de costo</h3></div><div class="card-b">${hbars(byKey('centro'), 'var(--brand)')}</div></div>`}
    <div class="card"><div class="card-h"><h3>Por categoría</h3><button class="link" data-goto-gastos="${P}">Ver detalle</button></div><div class="card-b">${hbars(byKey('categoria',6), 'var(--orange)')}</div></div>
    <div class="card"><div class="card-h"><h3>Forma de pago</h3></div><div class="card-b"><div class="pays">${pagos.map(([k,a]) => `
      <div class="pay"><div class="l"><i style="background:${PAGO_COLOR[k]}"></i>${PAGOS[k]}</div><div class="v num">${clp(a)}</div></div>`).join('')}</div>
      <div class="card-h" style="padding:16px 0 4px"><h3>Próximos vencimientos</h3><button class="link" data-nav="porpagar">Ver todo</button></div>
      ${pend.slice(0,5).map(x => { const d = diffDays(x.vencimiento||t, t); return `
        <div class="hbar" style="cursor:pointer" data-edit="${x.id}"><div class="n">${esc(x.proveedor)} <span class="note">· N° ${esc(x.numero||'s/n')}</span></div><div class="a num">${clp(saldo(x))}</div>
        <div style="grid-column:1/-1"><span class="pill ${d<0?'red':d<=AVISO_FACTURAS_DIAS?'amber':'gray'}">${fdate(x.vencimiento)} · ${relDays(d)}</span>${abonado(x)?` <span class="pill blue">abonado ${clp(abonado(x))}</span>`:''}</div></div>`; }).join('') || '<div class="empty">No hay facturas pendientes</div>'}
    </div></div>
    ${!C && semanas ? semanas : ''}
  </div>`;
  $('#dashMes').onchange = e => { state.dashMes = e.target.value; render(); };

function alertHTML(a){
  const isF = a.tipo === 'fijo';
  const title = isF ? `${esc(a.f.nombre)} · ${ymLabel(a.ym)}` : `Factura N° ${esc(a.g.numero||'s/n')} · ${esc(a.g.proveedor)}`;
  return `<div class="alert ${a.nivel}"><div class="ico">${ic(a.nivel==='red'?'alert':'bell')}</div>
    <div class="t"><b>${title}</b><small>${isF?'Gasto fijo':'Factura a crédito'} · ${relDays(a.d)} (${fdate(a.due)})</small></div>
    <div class="amt num">${clp(isF ? a.f.monto : saldo(a.g))}</div>
    ${isF ? `<button class="btn btn-sm" data-pay-fijo="${a.f.id}" data-ym="${a.ym}">Registrar pago</button>` : `<button class="btn btn-sm" data-pay="${a.g.id}">Pagar / abonar</button>`}</div>`;
}

function periodOptions(sel, withAll){
  const t = today(), cw = weekStart(t);
  const ms = new Set([curYM(), ...state.gastos.map(g => (g.fecha||'').slice(0,7)).filter(Boolean)]);
  if (sel && sel !== 'todos' && !isWeek(sel)) ms.add(sel);
  const weeks = Array.from({length:12}, (_,i) => 'w:' + addDays(cw, -7*i));
  if (isWeek(sel) && !weeks.includes(sel)) weeks.push(sel);
  const o = (v, l) => `<option value="${v}" ${v===sel?'selected':''}>${l}</option>`;
  return (withAll ? o('todos', 'Todos los meses') : '') +
    `<optgroup label="Por mes">${[...ms].sort().reverse().map(m => o(m, ymLabel(m).replace(/^./, c=>c.toUpperCase()))).join('')}</optgroup>` +
    `<optgroup label="Por semana">${weeks.map((w,i) => o(w, (i===0?'Esta semana · ':i===1?'Semana pasada · ':'Semana ') + weekLabel(w.slice(2)))).join('')}</optgroup>`;
}
const centroSelect = (id, val, allLabel = 'Todos los locales') => `<select class="input" id="${id}" style="width:auto"><option value="">${allLabel}</option>${CENTS().map(c => `<option ${c===val?'selected':''}>${esc(c)}</option>`).join('')}</select>`;

/* ---------- Gastos ---------- */
function filteredGastos(){
  const f = state.f, q = f.q.trim().toLowerCase();
  return state.gastos.filter(g =>
    inPeriod(g.fecha, f.mes) && (!f.centro || g.centro === f.centro) && (!f.cat || g.categoria === f.cat) &&
    (!f.tipo || g.tipoDoc === f.tipo) && (!f.pago || g.formaPago === f.pago) &&
    (!q || [g.proveedor,g.numero,g.descripcion,g.rut].join(' ').toLowerCase().includes(q))
  ).sort((a,b) => (b.fecha||'').localeCompare(a.fecha||'') || (b.creadoEn||'').localeCompare(a.creadoEn||''));
}

function estadoPill(g){
  if (g.formaPago !== 'credito') return `<span class="pill ${g.formaPago==='efectivo'?'green':g.formaPago==='transferencia'?'blue':'gray'}">${PAGOS[g.formaPago]||'—'}</span>`;
  if (g.estado === 'pagado') return `<span class="pill green">Crédito · pagada</span>`;
  const d = g.vencimiento ? diffDays(g.vencimiento, today()) : 99;
  const ab = abonado(g);
  return `<span class="pill ${d<0?'red':d<=AVISO_FACTURAS_DIAS?'amber':'purple'}">Crédito · ${d<0?'vencida':ab?'con abono':'pendiente'}</span>`;
}

function rowSub(g){
  if (g.tipoDoc === 'sueldo') return `Sueldo · ${TIPO_SUELDO[g.tipoPagoSueldo]||''}${g.periodoSueldo?' '+ymLabel(g.periodoSueldo):''} · ${JORNADAS[g.jornada]||''} · ${esc(g.centro||'')}`;
  if (g.tipoDoc === 'sindoc') { const it = g.items||[]; return `Sin boleta · ${esc(g.centro||'')} · ${it.length ? esc(it.map(i => i.producto).join(', ')) : esc(g.descripcion||g.categoria||'')}`; }
  return `${TIPOS[g.tipoDoc]||''}${g.numero?' N° '+esc(g.numero):''} · ${esc(g.centro||'')} · ${esc(g.categoria||'')}${g.descripcion?' · '+esc(g.descripcion):''}`;
}
function rowHTML(g){
  return `<button class="row" data-edit="${g.id}">
    <div><div class="r-title">${esc(g.proveedor||'Sin proveedor')}${g.tieneFoto?ic('clip'):''}</div>
      <div class="r-sub">${rowSub(g)}</div></div>
    <div class="r-date">${fdate(g.fecha)}</div>
    <div class="r-state">${estadoPill(g)}</div>
    <div class="r-amt num">${clp(g.total)}</div></button>`;
}

function viewGastos(v){
  const f = state.f, list = filteredGastos();
  const sel = (k, opts, label) => `<select class="input" data-f="${k}"><option value="">${label}</option>${opts.map(([val,l]) => `<option value="${esc(val)}" ${f[k]===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  v.innerHTML = `
  <div class="page-head"><div><h2>Gastos</h2><div class="sub">Facturas, boletas y otros comprobantes</div></div>
    <div style="display:flex;gap:8px"><button class="btn" data-act="csv">${ic('dl')} Exportar</button><button class="btn btn-primary btn-desk" data-act="new">${ic('plus')} Nuevo gasto</button></div></div>
  <div class="filters">
    <input class="input search" data-f="q" placeholder="Buscar proveedor, N°, descripción…" value="${esc(f.q)}">
    <select class="input" data-f="mes">${periodOptions(f.mes, true)}</select>
    ${sel('centro', CENTS().map(c=>[c,c]), 'Todos los centros')}
    ${sel('cat', CATS().map(c=>[c,c]), 'Todas las categorías')}
    ${sel('tipo', Object.entries(TIPOS), 'Todo tipo de doc.')}

  </div>
  <div class="card">
    <div class="list-sum"><span>${list.length} documento${list.length===1?'':'s'}</span><span>Total <b class="num">${clp(sum(list))}</b></span></div>
    ${list.length ? list.map(rowHTML).join('') : '<div class="empty">No hay gastos con estos filtros</div>'}
  </div>`;
  v.querySelectorAll('[data-f]').forEach(el => el.addEventListener(el.tagName === 'INPUT' ? 'input' : 'change', e => {
    state.f[el.dataset.f] = e.target.value;
    if (el.tagName === 'INPUT') { clearTimeout(viewGastos.t); viewGastos.t = setTimeout(() => { render(); const s = $('[data-f=q]'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }, 250); }
    else render();
  }));

/* ---------- Por pagar ---------- */

      ${pend.length ? groups.filter(gr => gr[2].length).map(([title,cls,list]) => `

          <div class="row row-pp" data-edit="${g.id}">
            <div><div class="r-title">${esc(g.proveedor)}</div><div class="r-sub">Factura N° ${esc(g.numero||'s/n')} · ${esc(g.centro)} · emitida ${fdate(g.fecha)}</div></div>
            <div class="r-state"><span class="pill ${d===null?'gray':d<0?'red':d<=AVISO_FACTURAS_DIAS?'amber':'gray'}">${d===null?'Sin vencimiento':fdate(g.vencimiento)+' · '+relDays(d)}</span></div>
            <div class="r-amt num">${clp(saldo(g))}${abonado(g) ? `<div class="note" style="font-weight:400">de ${clp(g.total)} · abonado ${clp(abonado(g))}</div>` : ''}</div>
            <div class="r-act" style="text-align:right"><button class="btn btn-sm" data-pay="${g.id}">Pagar / abonar</button></div>
          </div>`; }).join('')}`).join('') : '<div class="empty">🎉 No hay facturas pendientes de pago</div>'}
    </div>

/* Abono general a la cuenta de un proveedor: se reparte entre sus facturas pendientes */
function abonoProveedorForm(prov){
  const facs = pendientes().filter(g => (g.proveedor||'Sin proveedor') === prov)
    .sort((a,b) => (a.vencimiento||a.fecha||'9').localeCompare(b.vencimiento||b.fecha||'9') || (a.fecha||'').localeCompare(b.fecha||''));
  const deuda = sumSaldo(facs), t = today();
  const body = `
    <div class="box"><b>${esc(prov)}</b><div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px"><span class="note">${facs.length} factura${facs.length===1?'':'s'} pendiente${facs.length===1?'':'s'}</span><span class="num" style="font-size:22px;font-weight:700">${clp(deuda)}</span></div></div>
    <label class="field"><span>Monto del abono</span><input class="input num" name="monto" inputmode="numeric" placeholder="$0" style="font-weight:600;font-size:17px"></label>
    <label class="field"><span>¿A qué facturas se aplica?</span>${seg('modo', { antiguas:'A las más antiguas primero', elegir:'Elegir facturas' }, 'antiguas')}</label>
    <div class="box" style="display:grid;gap:0;padding:4px 12px" id="facList">${facs.map((g,i) => { const d = g.vencimiento ? diffDays(g.vencimiento, t) : null; return `
      <label style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;${i?'border-top:1px solid var(--border)':''}">
        <input type="checkbox" data-fac="${g.id}" checked style="width:18px;height:18px">
        <span style="min-width:0"><b style="font-size:13.5px">N° ${esc(g.numero||'s/n')}</b> <span class="note">· ${fdate(g.fecha)}</span><br>
          <span class="pill ${d===null?'gray':d<0?'red':d<=AVISO_FACTURAS_DIAS?'amber':'gray'}">${d===null?'Sin vencimiento':'vence '+fdate(g.vencimiento)}</span></span>
        <span style="text-align:right"><span class="num" style="font-weight:600">${clp(saldo(g))}</span><br><span class="note num" data-prev="${g.id}"></span></span>
      </label>`; }).join('')}</div>
    <div class="grid2">
      <label class="field"><span>Fecha del abono</span><input class="input" type="date" name="fecha" value="${t}"></label>
      <label class="field"><span>Pagado con</span><select class="input" name="medio">${Object.entries(MEDIOS_PAGO_CREDITO).map(([k,l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
    </div>
    <div class="note" id="abInfo"></div>`;
  const form = openModal('Abono a proveedor', body, `<span class="spacer"></span><button type="button" class="btn" data-close2>Cancelar</button><button class="btn btn-primary">Registrar abono</button>`);
  form.querySelector('[data-close2]').onclick = closeModal;
  const boxes = [...form.querySelectorAll('[data-fac]')];
  const reparto = () => { let rest = parseMonto(form.monto.value); const elegir = form.modo.value === 'elegir', out = [];
    facs.forEach(g => { const on = !elegir || boxes.find(b => b.dataset.fac === g.id).checked; const a = on ? Math.min(rest, saldo(g)) : 0; rest -= a; out.push([g, a]); });
    return { out, sobra: rest }; };
  const upd = () => { const elegir = form.modo.value === 'elegir';
    boxes.forEach(b => { b.style.visibility = elegir ? 'visible' : 'hidden'; });
    const { out, sobra } = reparto(), m = parseMonto(form.monto.value);
    out.forEach(([g,a]) => { const el = form.querySelector(`[data-prev="${g.id}"]`); el.innerHTML = a ? `<span style="color:var(--green)">−${clp(a)}</span> → ${saldo(g)-a ? 'queda '+clp(saldo(g)-a) : '<b style="color:var(--green)">pagada</b>'}` : ''; });
    const n = out.filter(([,a]) => a).length;
    $('#abInfo', form).innerHTML = !m ? 'Escribe el monto para ver cómo se reparte.' : sobra > 0 ? `<span style="color:var(--amber)">⚠ El abono supera la deuda de las facturas ${elegir?'elegidas':'pendientes'} en ${clp(sobra)}. Solo se registrará ${clp(m - sobra)}.</span>` : `Se abonará a ${n} factura${n===1?'':'s'}.`; };
  form.addEventListener('change', upd);
  form.monto.addEventListener('input', () => { const n = parseMonto(form.monto.value); form.monto.value = n ? n.toLocaleString('es-CL') : ''; upd(); });
  upd(); form.monto.focus();
  form.onsubmit = async e => { e.preventDefault();
    const { out } = reparto(), aplicar = out.filter(([,a]) => a > 0), fecha = form.fecha.value || t, medio = form.medio.value;
    if (!aplicar.length) return toast(parseMonto(form.monto.value) ? 'Elige al menos una factura' : 'Indica el monto del abono');
    const btn = form.querySelector('.btn-primary'); btn.disabled = true; btn.textContent = 'Guardando…';
    try {
      await Promise.all(aplicar.map(([g,a]) => { const liquida = a >= saldo(g);
        const upd2 = { abonos:[...(g.abonos||[]), { fecha, monto:a, medio, por:state.user.email, general:true }], editadoPor:state.user.email, editadoEn:new Date().toISOString() };
        if (liquida) Object.assign(upd2, { estado:'pagado', fechaPago:fecha, medioPago:medio });
        return store.update('gastos', g.id, upd2); }));
      const pagadas = aplicar.filter(([g,a]) => a >= saldo(g)).length;

function trabajadorForm(t, stacked){
  return new Promise(resolve => {

    const done = v => { wrap.remove(); if (!stacked && !$('#modal')) document.body.style.overflow = ''; resolve(v); };
    wrap.querySelectorAll('[data-c]').forEach(b => b.onclick = () => done(null));
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) done(null); });

      const nuevo = { nombre, jornada:fd.get('jornada'), centro:fd.get('centro'), activo: isNew ? true : !!fd.get('activo') };

    };
  });
}

function openModal(title, body, foot){

function closeModal(){ $('#modal')?.remove(); document.body.style.overflow = ''; }

function toast(msg){ $('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }

const seg = (name, opts, val) => `<div class="seg">${Object.entries(opts).map(([k,l]) => `<label><input type="radio" name="${name}" value="${k}" ${k===val?'checked':''}><span>${l}</span></label>`).join('')}</div>`;
const selOpts = (opts, val, addLabel) => { const list = val && !opts.includes(val) ? [...opts, val] : opts;
  return list.map(o => `<option ${o===val?'selected':''}>${esc(o)}</option>`).join('') + (addLabel ? `<option value="__new">＋ ${addLabel}</option>` : ''); };

/* Listas editables (se guardan en Firebase como fijos/_listas) */
async function saveListas(categorias = CATS(), centros = CENTS(), trabajadores = TRABS()){
  state.listas = { categorias:[...categorias], centros:[...centros], trabajadores:trabajadores.map(t => ({...t})) };
  await store.set('fijos', '_listas', state.listas);
}
async function addToList(tipo, nombre){
  nombre = (nombre||'').trim(); if (!nombre) return null;
  const key = tipo === 'centro' ? 'centros' : 'categorias', cur = tipo === 'centro' ? CENTS() : CATS();
  const ex = cur.find(x => x.toLowerCase() === nombre.toLowerCase()); if (ex) return ex;
  await saveListas(key === 'categorias' ? [...cur, nombre] : CATS(), key === 'centros' ? [...cur, nombre] : CENTS());
  return nombre;
}
function wireAddNew(form){
  [['categoria','categoría','Agregar categoría…'],['centro','centro de costo','Agregar centro…']].forEach(([name, label, addLabel]) => {
    const sel = form[name]; if (!sel) return; let prev = sel.value;
    sel.addEventListener('focus', () => { prev = sel.value; });
    sel.addEventListener('change', async () => {
      if (sel.value !== '__new') { prev = sel.value; return; }
      const nombre = prompt(`Nombre de la nueva ${label}:`);
      if (!nombre || !nombre.trim()) { sel.value = prev; return; }
      try { const v = await addToList(name, nombre);
        sel.innerHTML = selOpts(name === 'centro' ? CENTS() : CATS(), v, addLabel); sel.value = v; prev = v; toast(`"${v}" agregada ✓`); }
      catch (err) { sel.value = prev; toast('No se pudo guardar: ' + (err.code||err.message)); }
    });
  });
}

function provDatalist(){
  const m = {}; state.gastos.forEach(g => { if (g.proveedor) m[g.proveedor] = m[g.proveedor] || g.rut || ''; });
  state.fijos.forEach(f => { if (f.proveedor) m[f.proveedor] ||= ''; });
  return `<datalist id="provs">${Object.keys(m).sort().map(p => `<option value="${esc(p)}">`).join('')}</datalist>`;
}

    <div class="grid2">

      <div class="grid2">
        <label class="field"><span>Fecha de vencimiento</span><input class="input" type="date" name="vencimiento" value="${g.vencimiento||''}"></label>
        <label class="field"><span>Estado</span><select class="input" name="estado"><option value="pendiente" ${g.estado!=='pagado'?'selected':''}>Pendiente de pago</option><option value="pagado" ${g.estado==='pagado'?'selected':''}>Pagada</option></select></label>
      </div>
      ${(g.abonos||[]).length ? `<div class="note" style="display:grid;gap:2px"><b style="color:var(--text)">Abonos registrados (${clp(abonado(g))})</b>${g.abonos.map((a,i) => `<span style="display:flex;justify-content:space-between;gap:8px"><span>${fdate(a.fecha)} · ${MEDIOS_PAGO_CREDITO[a.medio]||''} · ${clp(a.monto)}</span><button type="button" class="btn btn-sm btn-ghost" data-delabono="${i}" style="color:var(--red);padding:0 6px">quitar</button></span>`).join('')}</div>` : ''}

      <div class="grid2" id="pagoCredito">
        <label class="field"><span>Fecha de pago</span><input class="input" type="date" name="fechaPago" value="${g.fechaPago||''}"></label>
        <label class="field"><span>Pagada con</span><select class="input" name="medioPago">${Object.entries(MEDIOS_PAGO_CREDITO).map(([k,l]) => `<option value="${k}" ${g.medioPago===k?'selected':''}>${l}</option>`).join('')}</select></label>
      </div>
    </div>
    <div class="field"><span>Foto del documento (opcional)</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <label class="btn btn-sm">${ic('cam')} ${g.tieneFoto?'Cambiar foto':'Tomar / subir foto'}<input type="file" accept="image/*" capture="environment" name="foto" hidden></label>
        ${g.tieneFoto ? `<button type="button" class="btn btn-sm btn-ghost" id="verFoto">Ver foto actual</button>` : ''}
        <span class="note" id="fotoInfo"></span>
      </div>
      <div id="fotoPrev"></div>
    </div>
    <div class="note" id="dupWarn" style="color:var(--amber)"></div>
    ${!isNew ? `<div class="note">Registrado por ${esc(g.creadoPor||'—')}${g.creadoEn?' el '+fdate(g.creadoEn.slice(0,10)):''}</div>` : ''}`;
  const foot = `${!isNew ? `<button type="button" class="btn btn-danger" id="del">Eliminar</button>` : ''}<span class="spacer"></span>
    <button type="button" class="btn" data-close2>Cancelar</button><button class="btn btn-primary">${isNew?'Guardar gasto':'Guardar cambios'}</button>`;
  const form = openModal(isNew ? 'Nuevo gasto' : 'Editar gasto', body, foot);
  wireAddNew(form);
  form.querySelector('[data-close2]').onclick = closeModal;
  let fotoData = null;

  // --- productos sin boleta
  const itemsBox = $('#items', form);
  const itemRow = (it = {}) => {
    const r = document.createElement('div'); r.className = 'item-row';
    r.innerHTML = `<input class="input" data-k="producto" list="prods" placeholder="Producto" value="${esc(it.producto||'')}" autocomplete="off">
      <input class="input" data-k="cantidad" inputmode="decimal" placeholder="Cant." value="${it.cantidad ?? ''}">
      <select class="input" data-k="unidad">${UNIDADES.map(u => `<option ${u===(it.unidad||'kg')?'selected':''}>${u}</option>`).join('')}</select>
      <input class="input num" data-k="monto" inputmode="numeric" placeholder="$ total" value="${it.monto ? Number(it.monto).toLocaleString('es-CL') : ''}">
      <button type="button" class="x" title="Quitar">${ic('trash')}</button>`;
    r.querySelector('.x').onclick = () => { r.remove(); if (!itemsBox.children.length) itemsBox.appendChild(itemRow()); upd(); };
    const m = r.querySelector('[data-k=monto]'); m.addEventListener('input', () => { const n = parseMonto(m.value); m.value = n ? n.toLocaleString('es-CL') : ''; });
    return r;
  };
  const readItems = () => [...itemsBox.querySelectorAll('.item-row')].map(r => ({
    producto: r.querySelector('[data-k=producto]').value.trim(), cantidad: Number(String(r.querySelector('[data-k=cantidad]').value).replace(',','.')) || 0,
    unidad: r.querySelector('[data-k=unidad]').value, monto: parseMonto(r.querySelector('[data-k=monto]').value) })).filter(i => i.producto || i.monto);
  (g.items?.length ? g.items : [{}]).forEach(it => itemsBox.appendChild(itemRow(it)));
  $('#addItem', form).onclick = () => { const r = itemRow(); itemsBox.appendChild(r); r.querySelector('input').focus(); };

  // --- trabajador
  let prevTrab = form.trabajador.value;
  form.trabajador.addEventListener('change', async () => {
    if (form.trabajador.value !== '__new') { prevTrab = form.trabajador.value; const t = TRABS().find(x => x.nombre === prevTrab); if (t?.centro && CENTS().includes(t.centro)) form.centro.value = t.centro; upd(); return; }
    const t = await trabajadorForm(null, true);
    form.trabajador.innerHTML = trabOpts(t ? t.nombre : prevTrab);
    if (t) { prevTrab = t.nombre; if (t.centro && CENTS().includes(t.centro)) form.centro.value = t.centro; }
    upd();
  });

  const upd = () => {
    let fd = new FormData(form), tipo = fd.get('tipoDoc'), pago = fd.get('formaPago');
    if (tipo === 'sindoc') { const t = readItems().reduce((a,i) => a + i.monto, 0); form.total.value = t ? t.toLocaleString('es-CL') : ''; }
    const total = parseMonto(form.total.value);
    form.querySelectorAll('[data-show]').forEach(el => el.style.display = el.dataset.show.split(' ').includes(tipo) ? '' : 'none');
    const credLbl = form.querySelector('input[name=formaPago][value=credito]').closest('label');
    credLbl.style.display = (tipo === 'sueldo' || tipo === 'sindoc') ? 'none' : '';
    if ((tipo === 'sueldo' || tipo === 'sindoc') && pago === 'credito') { form.querySelector('input[name=formaPago][value=efectivo]').checked = true; return upd(); }
    $('#lblFecha', form).textContent = tipo === 'sueldo' ? 'Fecha de pago' : tipo === 'sindoc' ? 'Fecha de compra' : 'Fecha del documento';
    $('#lblProv', form).textContent = tipo === 'sindoc' ? 'Dónde se compró (opcional)' : 'Proveedor / comercio';
    $('#lblTotal', form).textContent = tipo === 'factura' ? 'Monto total (con IVA)' : tipo === 'sueldo' ? 'Monto pagado' : tipo === 'sindoc' ? 'Total (suma de productos)' : 'Monto total';
    form.total.readOnly = tipo === 'sindoc';
    if (tipo === 'sindoc') { const t = readItems().reduce((a,i) => a + i.monto, 0); form.total.value = t ? t.toLocaleString('es-CL') : ''; }
    const tr = TRABS().find(t => t.nombre === form.trabajador.value);
    $('#jornadaTxt', form).textContent = tr ? `${JORNADAS[tr.jornada]||'—'}${tr.centro ? ' · ' + tr.centro : ''}` : '—';
    $('#creditoBox', form).style.display = pago === 'credito' ? 'grid' : 'none';
    $('#pagoCredito', form).style.display = fd.get('estado') === 'pagado' ? '' : 'none';
    const neto = fd.get('exenta') ? total : Math.round(total / 1.19);
    $('#netoIva', form).innerHTML = `<span>${clp(neto)}</span><span class="note">IVA ${clp(total - neto)}</span>`;
    const num = (fd.get('numero')||'').trim(), prov = (fd.get('proveedor')||'').trim().toLowerCase();
    const dup = num && state.gastos.find(x => x.id !== g.id && x.numero === num && (x.proveedor||'').toLowerCase() === prov && x.tipoDoc === tipo);
    $('#dupWarn', form).textContent = dup ? `⚠ Ya existe un documento N° ${num} de este proveedor (${fdate(dup.fecha)}, ${clp(dup.total)}).` : '';
  };
  form.addEventListener('input', upd); form.addEventListener('change', upd);
  const totalIn = form.total;
  totalIn.addEventListener('input', () => { const n = parseMonto(totalIn.value); totalIn.value = n ? n.toLocaleString('es-CL') : ''; });
  form.proveedor.addEventListener('change', () => {
    const last = state.gastos.filter(x => x.proveedor === form.proveedor.value).sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''))[0];
    if (last && isNew) { if (!form.rut.value) form.rut.value = last.rut || ''; form.centro.value = last.centro; form.categoria.value = last.categoria; upd(); }
  });
  form.querySelectorAll('[data-plazo]').forEach(b => b.onclick = () => { form.vencimiento.value = addDays(form.fecha.value || today(), Number(b.dataset.plazo)); });
  form.formaPago.forEach?.(r => r.addEventListener('change', () => {
    if (r.checked && r.value === 'credito') { form.estado.value = g.formaPago === 'credito' ? g.estado : 'pendiente'; if (!form.vencimiento.value) form.vencimiento.value = addDays(form.fecha.value || today(), 30); upd(); }
  }));
  form.querySelectorAll('[data-delabono]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Quitar este abono?')) return;
    const abonos = (g.abonos||[]).filter((_,i) => i !== Number(b.dataset.delabono));
    await store.update('gastos', g.id, { abonos, estado:'pendiente', fechaPago:'', medioPago:'' }); closeModal(); toast('Abono quitado');
  });
  form.estado.addEventListener('change', () => { if (form.estado.value === 'pagado' && !form.fechaPago.value) form.fechaPago.value = today(); });
  form.foto.addEventListener('change', async () => {
    const file = form.foto.files[0]; if (!file) return;
    $('#fotoInfo', form).textContent = 'Procesando…';
    try { fotoData = await compressImage(file); $('#fotoPrev', form).innerHTML = `<img class="photo-prev" src="${fotoData}" style="margin-top:8px">`;
      $('#fotoInfo', form).textContent = `Lista (${Math.round(fotoData.length*0.75/1024)} KB)`; }
    catch { $('#fotoInfo', form).textContent = 'No se pudo leer la imagen'; }
  });
  $('#verFoto', form)?.addEventListener('click', async () => {
    $('#fotoPrev', form).innerHTML = '<span class="note">Cargando…</span>';
    const f = await store.get('fotos', g.id); $('#fotoPrev', form).innerHTML = f?.data ? `<a href="${f.data}" target="_blank"><img class="photo-prev" src="${f.data}" style="margin-top:8px"></a>` : '<span class="note">Sin foto</span>';
  });
  $('#del', form)?.addEventListener('click', async () => {
    if (!confirm('¿Eliminar este gasto? No se puede deshacer.')) return;
    await store.remove('gastos', g.id); if (g.tieneFoto) store.remove('fotos', g.id).catch(()=>{}); closeModal(); toast('Gasto eliminado');
  });
  upd();

  form.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(form), total = parseMonto(fd.get('total')), tipo = fd.get('tipoDoc'), pago = fd.get('formaPago');
    if (fd.get('categoria') === '__new' || fd.get('centro') === '__new') return toast('Elige una categoría y centro');
    const items = tipo === 'sindoc' ? readItems() : [];
    if (tipo === 'sueldo' && (!fd.get('trabajador') || fd.get('trabajador') === '__new')) return toast('Elige el trabajador');
    if (tipo === 'sindoc' && !items.length) return toast('Agrega al menos un producto');
    if (tipo === 'sindoc' && items.some(i => !i.producto)) return toast('Falta el nombre de un producto');
    if (tipo !== 'sueldo' && tipo !== 'sindoc' && !fd.get('proveedor').trim()) return toast('Falta el proveedor');
    if (!total) return toast('Falta el monto');
    const trab = tipo === 'sueldo' ? TRABS().find(t => t.nombre === fd.get('trabajador')) : null;
    if (tipo === 'sueldo' && !CATS().includes(CAT_SUELDOS)) { try { await addToList('categoria', CAT_SUELDOS); } catch {} }
    if (!fd.get('fecha')) return toast('Falta la fecha');
    if (pago === 'credito' && !fd.get('vencimiento')) return toast('Indica la fecha de vencimiento');
    const exenta = tipo === 'factura' && !!fd.get('exenta');
    const neto = tipo === 'factura' && !exenta ? Math.round(total / 1.19) : total;
    const estado = pago === 'credito' ? fd.get('estado') : 'pagado';
    const data = {
      tipoDoc:tipo, fecha:fd.get('fecha'), numero: (tipo==='sueldo'||tipo==='sindoc') ? '' : fd.get('numero').trim(),
      proveedor: tipo==='sueldo' ? fd.get('trabajador') : (fd.get('proveedor').trim() || (tipo==='sindoc' ? 'Compra sin boleta' : '')),
      rut: tipo==='factura' ? fd.get('rut').trim() : '',
      centro:fd.get('centro'), categoria: tipo==='sueldo' ? CAT_SUELDOS : fd.get('categoria'), descripcion:fd.get('descripcion').trim(),
      trabajador: tipo==='sueldo' ? fd.get('trabajador') : '', jornada: trab?.jornada || '',
      tipoPagoSueldo: tipo==='sueldo' ? fd.get('tipoPagoSueldo') : '', periodoSueldo: tipo==='sueldo' ? (fd.get('periodoSueldo') || fd.get('fecha').slice(0,7)) : '',
      items,
      total, neto, iva: total - neto, exenta, formaPago:pago,
      vencimiento: pago === 'credito' ? fd.get('vencimiento') : '', estado,
      fechaPago: pago === 'credito' && estado === 'pagado' ? (fd.get('fechaPago') || today()) : '',
      medioPago: pago === 'credito' && estado === 'pagado' ? fd.get('medioPago') : '',
      fijoId: g.fijoId || '', periodo: g.periodo || '', tieneFoto: !!(g.tieneFoto || fotoData),
    };
    const btn = form.querySelector('.btn-primary'); btn.disabled = true; btn.textContent = 'Guardando…';
    try {
      let id = g.id;
      if (isNew) id = await store.add('gastos', { ...data, creadoPor:state.user.email, creadoEn:new Date().toISOString() });
      else await store.update('gastos', id, { ...data, editadoPor:state.user.email, editadoEn:new Date().toISOString() });
      if (fotoData) await store.set('fotos', id, { data:fotoData });
      closeModal(); toast(isNew ? 'Gasto guardado ✓' : 'Cambios guardados ✓');
    } catch (err) { btn.disabled = false; btn.textContent = 'Reintentar'; toast('Error al guardar: ' + (err.code || err.message)); }
  };
}

function payForm(g){
  const sal = saldo(g), ab = g.abonos || [];
  const body = `<div class="box"><b>${esc(g.proveedor)}</b><div class="note">Factura N° ${esc(g.numero||'s/n')} · total ${clp(g.total)} · vence ${fdate(g.vencimiento)}</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px"><span class="note">Saldo pendiente</span><span style="font-size:22px;font-weight:700" class="num">${clp(sal)}</span></div>
      ${ab.length ? `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:6px">${ab.map(a => `<div class="note" style="display:flex;justify-content:space-between"><span>Abono ${fdate(a.fecha)} · ${MEDIOS_PAGO_CREDITO[a.medio]||''}</span><span class="num">${clp(a.monto)}</span></div>`).join('')}</div>` : ''}
    </div>
    <label class="field"><span>¿Qué vas a registrar?</span>${seg('tipoPago', { total:`Pago total (${clp(sal)})`, abono:'Abono parcial' }, 'total')}</label>
    <label class="field" id="abonoBox" style="display:none"><span>Monto del abono</span><input class="input num" name="monto" inputmode="numeric" placeholder="$0" style="font-weight:600;font-size:17px"></label>
    <div class="grid2">
      <label class="field"><span>Fecha de pago</span><input class="input" type="date" name="fechaPago" value="${today()}" required></label>
      <label class="field"><span>Pagado con</span><select class="input" name="medioPago">${Object.entries(MEDIOS_PAGO_CREDITO).map(([k,l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
    </div>
    <div class="note" id="abonoInfo"></div>`;
  const form = openModal('Pagar o abonar factura', body, `<span class="spacer"></span><button type="button" class="btn" data-close2>Cancelar</button><button class="btn btn-primary">Confirmar</button>`);
  form.querySelector('[data-close2]').onclick = closeModal;
  const upd = () => { const tipo = form.tipoPago.value, m = parseMonto(form.monto.value);
    $('#abonoBox', form).style.display = tipo === 'abono' ? '' : 'none';
    $('#abonoInfo', form).textContent = tipo === 'abono' && m ? (m >= sal ? 'El abono cubre todo el saldo: la factura quedará pagada.' : `Quedará un saldo de ${clp(sal - m)}.`) : ''; };
  form.addEventListener('change', upd);
  form.monto.addEventListener('input', () => { const n = parseMonto(form.monto.value); form.monto.value = n ? n.toLocaleString('es-CL') : ''; upd(); });
  form.onsubmit = async e => { e.preventDefault(); const fd = new FormData(form), tipo = fd.get('tipoPago');
    const monto = tipo === 'abono' ? parseMonto(fd.get('monto')) : sal;
    if (!monto) return toast('Indica el monto del abono');
    const abonos = [...ab, { fecha:fd.get('fechaPago'), monto: Math.min(monto, sal), medio:fd.get('medioPago'), por:state.user.email }];
    const liquida = monto >= sal;
    const upd2 = { abonos, editadoPor:state.user.email, editadoEn:new Date().toISOString() };
    if (liquida) Object.assign(upd2, { estado:'pagado', fechaPago:fd.get('fechaPago'), medioPago:fd.get('medioPago') });
    try { await store.update('gastos', g.id, upd2); closeModal(); toast(liquida ? 'Factura pagada ✓' : `Abono registrado ✓ · saldo ${clp(sal - monto)}`); }
    catch (err) { toast('Error al guardar: ' + (err.code || err.message)); }
  };
}

function fijoForm(f = {}){
  const isNew = !f.id;
  f = { categoria:CATS().includes('Arriendo')?'Arriendo':CATS()[0], centro:CENTS()[0], dia:5, avisarDias:5, tipoDoc:'factura', activo:true, desde:curYM(), ...f };
  const body = `
    <label class="field"><span>Nombre</span><input class="input" name="nombre" value="${esc(f.nombre||'')}" placeholder="Ej: Arriendo Local Antonio Varas" required></label>
    <div class="grid2">
      <label class="field"><span>Categoría</span><select class="input" name="categoria">${selOpts(CATS(), f.categoria, 'Agregar categoría…')}</select></label>
      <label class="field"><span>Centro de costo</span><select class="input" name="centro">${selOpts(CENTS(), f.centro, 'Agregar centro…')}</select></label>
    </div>
    <label class="field"><span>Proveedor / arrendador</span><input class="input" name="proveedor" list="provs" value="${esc(f.proveedor||'')}" autocomplete="off"></label>${provDatalist()}
    <div class="grid2">
      <label class="field"><span>Monto mensual</span><input class="input num" name="monto" inputmode="numeric" value="${f.monto ? Number(f.monto).toLocaleString('es-CL') : ''}" required></label>
      <label class="field"><span>Día de pago (1–31)</span><input class="input" type="number" min="1" max="31" name="dia" value="${f.dia}" required></label>
    </div>
    <div class="grid2">
      <label class="field"><span>Avisar con (días antes)</span><input class="input" type="number" min="0" max="30" name="avisarDias" value="${f.avisarDias}"></label>
      <label class="field"><span>Documento habitual</span><select class="input" name="tipoDoc">${Object.entries(TIPOS).map(([k,l]) => `<option value="${k}" ${f.tipoDoc===k?'selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    <div class="grid2">
      <label class="field"><span>Controlar desde</span><input class="input" type="month" name="desde" value="${f.desde}"></label>
      <label class="field"><span>Estado</span><select class="input" name="activo"><option value="1" ${f.activo!==false?'selected':''}>Activo</option><option value="0" ${f.activo===false?'selected':''}>Inactivo</option></select></label>
    </div>`;
  const foot = `${!isNew ? `<button type="button" class="btn btn-danger" id="del">Eliminar</button>` : ''}<span class="spacer"></span>
    <button type="button" class="btn" data-close2>Cancelar</button><button class="btn btn-primary">Guardar</button>`;
  const form = openModal(isNew ? 'Nuevo gasto fijo' : 'Editar gasto fijo', body, foot);
  wireAddNew(form);
  form.querySelector('[data-close2]').onclick = closeModal;
  form.monto.addEventListener('input', () => { const n = parseMonto(form.monto.value); form.monto.value = n ? n.toLocaleString('es-CL') : ''; });
  $('#del', form)?.addEventListener('click', async () => { if (!confirm('¿Eliminar este gasto fijo? Los pagos ya registrados se mantienen.')) return; await store.remove('fijos', f.id); closeModal(); toast('Gasto fijo eliminado'); });
  form.onsubmit = async e => { e.preventDefault(); const fd = new FormData(form);
    if (!fd.get('nombre').trim() || !parseMonto(fd.get('monto'))) return toast('Completa nombre y monto');
    const data = { nombre:fd.get('nombre').trim(), categoria:fd.get('categoria'), centro:fd.get('centro'), proveedor:fd.get('proveedor').trim(),
      monto:parseMonto(fd.get('monto')), dia:Math.min(31, Math.max(1, Number(fd.get('dia'))||1)), avisarDias:Number(fd.get('avisarDias'))||0,
      tipoDoc:fd.get('tipoDoc'), desde:fd.get('desde') || curYM(), activo:fd.get('activo') === '1' };
    if (isNew) await store.add('fijos', data); else await store.update('fijos', f.id, data);
    closeModal(); toast('Gasto fijo guardado ✓'); };
}

function compressImage(file, max = 1400, q = 0.6){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { let { width:w, height:h } = img; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w*s); h = Math.round(h*s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      let out = c.toDataURL('image/jpeg', q); if (out.length > 900000) out = c.toDataURL('image/jpeg', 0.4); res(out); };
    img.onerror = rej; img.src = url;
  });
}

function exportCSV(){
  const list = filteredGastos();
  const cols = [['fecha','Fecha'],['tipoDoc','Tipo'],['numero','N°'],['proveedor','Proveedor'],['rut','RUT'],['centro','Centro de costo'],['categoria','Categoría'],['descripcion','Descripción'],
    ['neto','Neto'],['iva','IVA'],['total','Total'],['formaPago','Forma de pago'],['vencimiento','Vencimiento'],['estado','Estado'],['fechaPago','Fecha pago'],['medioPago','Pagada con'],['abonado','Abonado'],['saldo','Saldo'],['trabajador','Trabajador'],['jornada','Jornada'],['tipoPagoSueldo','Tipo pago sueldo'],['periodoSueldo','Mes sueldo'],['productos','Productos'],['creadoPor','Registrado por']];
  const q = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const csv = '﻿' + [cols.map(c => c[1]).join(';'), ...list.map(g => cols.map(([k]) => q(k==='productos' ? (g.items||[]).map(i => `${i.producto} ${i.cantidad||''}${i.unidad||''} $${i.monto}`).join(' | ') : k==='tipoDoc' ? TIPOS[g.tipoDoc]||g.tipoDoc : k==='abonado' ? abonado(g) : k==='saldo' ? saldo(g) : g[k])).join(';'))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = `gastos_renni_${String(state.f.mes).replace(':','_')}${state.f.centro?'_'+state.f.centro.replace(/\s+/g,'-'):''}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================================================================
   7) EVENTOS GLOBALES E INICIO
   ================================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-nav],[data-act],[data-edit],[data-pay],[data-pay-fijo],[data-edit-fijo],[data-mes],[data-goto-gastos]');
  if (!el || el.closest('#modal')) return;
  const d = el.dataset;
  if (d.pay) { e.stopPropagation(); const g = state.gastos.find(x => x.id === d.pay); if (g) payForm(g); return; }
  if (d.payFijo) { e.stopPropagation(); const f = state.fijos.find(x => x.id === d.payFijo);
    if (f) gastoForm({ fijoId:f.id, periodo:d.ym, proveedor:f.proveedor, categoria:f.categoria, centro:f.centro, total:f.monto, tipoDoc:f.tipoDoc||'factura', descripcion:`${f.nombre} ${ymLabel(d.ym)}` }); return; }
  if (d.editFijo) { const f = state.fijos.find(x => x.id === d.editFijo); if (f) fijoForm(f); return; }
  if (d.edit) { const g = state.gastos.find(x => x.id === d.edit); if (g) gastoForm(g); return; }
  if (d.mes) { state.dashMes = d.mes; render(); return; }
  if (d.gotoGastos) { state.f = { ...state.f, mes:d.gotoGastos, centro:state.dashCentro||'', cat:'', tipo:'', pago:'', q:'' }; state.view = 'gastos'; render(); window.scrollTo(0,0); return; }
  if (d.nav) { state.view = d.nav; render(); window.scrollTo(0,0); return; }
  if (d.act === 'new') gastoForm();
  if (d.act === 'new-fijo') fijoForm();
  if (d.act === 'csv') exportCSV();
  if (d.act === 'more') moreMenu();
  if (d.act === 'logout' && confirm(DEMO ? '¿Salir del modo demo? Se borrarán los datos de ejemplo.' : '¿Cerrar sesión?')) store.logout();
});

(async function init(){
  try { store = DEMO ? demoStore() : await firebaseStore(); }
  catch (err) { root.innerHTML = `<div class="loading">No se pudo cargar Firebase. Revisa tu conexión.<br><small>${esc(err.message)}</small></div>`; return; }
  store.onAuth(user => {
    state.user = user;
    if (!user) { closeModal(); renderLogin(); return; }
    state.ready = { gastos:false, fijos:false }; state.error = null;
    renderShell(); render();
    const onErr = err => { state.error = err.code === 'permission-denied'
      ? `El usuario ${user.email} no está autorizado. Pide al administrador que agregue este correo en las reglas de Firestore.` : (err.message||String(err)); render(); };
    store.watch('gastos', d => { state.gastos = d; state.ready.gastos = true; render(); }, onErr);
    store.watch('fijos', d => { const l = d.find(x => x.id === '_listas'); state.listas = l ? { categorias:l.categorias||[], centros:l.centros||[], trabajadores:l.trabajadores||[] } : null;
      state.fijos = d.filter(x => !String(x.id).startsWith('_')); state.ready.fijos = true; render(); }, onErr);
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
